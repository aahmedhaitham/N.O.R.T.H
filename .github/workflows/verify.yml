name: Verify NORTH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan tracked history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        run: |
          docker run --rm --network none -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --log-opts=--all --redact=100 --no-banner /repo
  test:
    name: API tests and frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Run backend suite
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -o faulthandler_timeout=30 tests
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Test cloud authentication and snapshot API
        run: node --test cloud/worker.test.mjs cloud/geoip.test.mjs

  compose:
    name: Docker demo and PostgreSQL persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install "websockets==16.0"
      - name: Start the demo and verify the gateway
        run: |
          docker compose up --build --wait --wait-timeout 120
          python backend/smoke_demo.py http://127.0.0.1:8080
      - name: Restart with the demo seed disabled
        run: |
          docker compose down
          NORTH_SEED_DEMO=0 docker compose up --wait --wait-timeout 120
          python backend/smoke_demo.py http://127.0.0.1:8080
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down disposable stack
        if: always()
        run: docker compose down --volumes

  linux-collector:
    name: Linux collector first sync
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and run the downloadable collector
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File tools/Build-NorthCollectorZip.ps1 -Platform Linux -OutputPath "$RUNNER_TEMP/north-linux.zip"
          unzip -q "$RUNNER_TEMP/north-linux.zip" -d "$RUNNER_TEMP/north-linux"
          python tools/smoke_linux_collector.py "$RUNNER_TEMP/north-linux"

  hosted-demo:
    name: Public demo image
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install "websockets==16.0"
      - name: Build the public image
        run: docker build -t north-public .
      - name: Start the public service and wait for health
        run: |
          docker run -d --name north-public -p 127.0.0.1:8081:10000 north-public
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --retry-max-time 45 --max-time 3 http://127.0.0.1:8081/api/health
      - name: Verify the public console
        run: python backend/smoke_demo.py http://127.0.0.1:8081 --read-only
      - name: Print public service logs on failure
        if: failure()
        run: docker logs north-public || true
