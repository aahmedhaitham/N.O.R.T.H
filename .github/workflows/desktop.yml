name: Build NORTH for Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'frontend/**'
      - 'backend/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the standalone collector
        shell: pwsh
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw 'Collector build dependencies could not install.' }
          python -m PyInstaller --onefile --noconfirm --noupx --name NORTH-Collector --distpath backend --workpath "$env:RUNNER_TEMP/north-collector-build" --specpath "$env:RUNNER_TEMP" --hidden-import anyio._backends._asyncio backend/run_collector.py
          if ($LASTEXITCODE -ne 0) { throw 'Standalone collector build failed.' }
          & ./backend/NORTH-Collector.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Standalone collector runtime check failed.' }
      - name: Install frontend and desktop dependencies
        run: |
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependencies could not install.' }
          npm --prefix desktop ci
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependencies could not install.' }
      - name: Test the desktop client
        working-directory: desktop
        run: npm test
      - name: Check Windows scripts and TypeScript
        shell: pwsh
        run: |
          Get-ChildItem desktop -File -Filter *.cjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid script: $($_.Name)" }
          }
          node --check tools/Test-NorthWindowsModes.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Windows walkthrough script.' }
          & frontend/node_modules/.bin/tsc.cmd --project frontend/tsconfig.json
          if ($LASTEXITCODE -ne 0) { throw 'Frontend type check failed.' }
      - name: Package Windows downloads
        run: |
          npm --prefix desktop run package:windows
          if ($LASTEXITCODE -ne 0) { throw 'Portable package build failed.' }
          npm --prefix desktop run package:installer
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer build failed.' }
      - name: Smoke test Simple and Analyst modes from the installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'north-install-smoke'
          $installer = (Resolve-Path 'desktop/dist/NORTH-Setup-Windows-x64.exe').Path
          $setup = Start-Process -FilePath $installer -ArgumentList "/S /D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed with exit code $($setup.ExitCode)." }
          $collector = Join-Path $installDir 'resources/north-collector/backend/NORTH-Collector.exe'
          if (!(Test-Path -LiteralPath $collector)) { throw 'Installer did not include the collector runtime.' }
          & $collector --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed collector runtime check failed.' }
          node tools/Test-NorthWindowsModes.mjs (Join-Path $installDir 'NORTH.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows mode walkthrough failed.' }
      - name: Write download checksums
        shell: pwsh
        run: |
          $downloads = @('NORTH-Desktop-Windows-x64.exe', 'NORTH-Setup-Windows-x64.exe')
          $downloads | ForEach-Object {
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath "desktop/dist/$_").Hash.ToLowerInvariant()
            "$digest  $_"
          } | Set-Content -Encoding ascii desktop/dist/SHA256SUMS.txt
      - name: Attest Windows build provenance
        id: provenance
        if: github.event.repository.private == false || vars.NORTH_ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            desktop/dist/NORTH-Desktop-Windows-x64.exe
            desktop/dist/NORTH-Setup-Windows-x64.exe
      - name: Record preview build metadata
        shell: pwsh
        env:
          ATTESTATION_OUTCOME: ${{ steps.provenance.outcome }}
        run: |
          $files = Get-Content -LiteralPath desktop/dist/SHA256SUMS.txt | ForEach-Object {
            $digest, $name = $_ -split '  ', 2
            @{ name = $name; sha256 = $digest }
          }
          [ordered]@{
            channel = 'unsigned-preview'
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            attestation = $env:ATTESTATION_OUTCOME
            files = @($files)
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 desktop/dist/BUILD-INFO.json
      - uses: actions/upload-artifact@v4
        with:
          name: NORTH-Windows-x64
          path: |
            desktop/dist/NORTH-Desktop-Windows-x64.exe
            desktop/dist/NORTH-Setup-Windows-x64.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/BUILD-INFO.json
          if-no-files-found: error
